version: "3.8"

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sinistros_postgres
    environment:
      POSTGRES_DB: sinistros_prf
      POSTGRES_USER: prf_user
      POSTGRES_PASSWORD: prf_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sinistros_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prf_user -d sinistros_prf"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  sinistros_net:
    driver: bridge

volumes:
  postgres_data:
    name: sinistros_postgres_data
